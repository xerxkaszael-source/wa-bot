<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catur Online — WhatsApp Bot</title>
<style>
:root{color-scheme:dark;--bg:#0b1110;--card:#121c19;--line:#2a4037;--green:#25d366;--muted:#9db0a8;--light:#e8d9b5;--dark:#75966b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#163b2b,#0b1110 58%);color:#eff8f2;font:15px/1.45 system-ui,sans-serif;padding:18px}.wrap{width:min(100%,880px);margin:auto}.panel{background:#111c18;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 15px 45px #0003}h1{margin:0;font-size:24px}p{color:var(--muted);margin:5px 0 12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--muted);font-size:12px}.setup{display:flex;gap:8px;flex-wrap:wrap}.setup input{flex:1;min-width:140px}input,button{border:1px solid #385147;border-radius:10px;padding:11px 12px;font:inherit}input{background:#09100d;color:white}button{cursor:pointer;background:var(--green);border-color:transparent;color:#06200f;font-weight:750}button.secondary{background:#20332b;color:#e7f5ec;border-color:#385147}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,.65fr);gap:14px;align-items:start}.board{width:100%;max-width:560px;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:5px solid #26392e;border-radius:7px;overflow:hidden;touch-action:manipulation}.sq{border:0;border-radius:0;padding:0;display:grid;place-items:center;position:relative;font-size:clamp(22px,6vw,55px);line-height:1}.sq.light{background:var(--light);color:#111}.sq.dark{background:var(--dark);color:#111}.sq.selected{box-shadow:inset 0 0 0 5px #25d366}.sq.target:after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:#14271a70}.sq.last{box-shadow:inset 0 0 0 4px #e5c84d99}.sq .coord{position:absolute;font-size:10px;left:3px;top:1px;color:#263629;opacity:.75}.side{display:grid;gap:10px}.status{padding:12px;background:#0a130f;border:1px solid var(--line);border-radius:12px;overflow-wrap:anywhere}.players{display:grid;gap:7px}.player{padding:10px;border-radius:10px;border:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.player.active{border-color:var(--green);background:#123022}.muted{color:var(--muted);font-size:13px}.msg{min-height:22px;color:#ffcf78;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.hidden{display:none!important}@media(max-width:650px){.layout{grid-template-columns:1fr}.panel{padding:13px}.board{max-width:100%}.side{grid-row:2}}
</style></head><body><main class="wrap"><section class="panel"><div class="top"><div><h1>♟ Catur Online</h1><p>Main realtime bareng teman dari WhatsApp.</p></div><span id="connection" class="pill">Menghubungkan…</span></div><div id="setup" class="setup"><input id="name" maxlength="24" placeholder="Nama kamu" autocomplete="nickname"><button id="join">Gabung game</button></div><div id="error" class="msg"></div></section>
<section class="layout"><div class="panel"><div id="board" class="board" aria-label="Papan catur"></div><p class="muted">Tap bidak lalu tap kotak tujuan. Promosi pion otomatis menjadi ratu.</p></div><aside class="panel side"><div id="status" class="status">Masukkan nama lalu gabung.</div><div class="players"><div id="white" class="player"><span>♔ Putih</span><strong>Menunggu</strong></div><div id="black" class="player"><span>♚ Hitam</span><strong>Menunggu</strong></div></div><div class="actions"><button class="secondary" id="reset">Mulai ulang</button><button class="secondary" id="copy">Salin link</button></div><div class="muted">Game ID: <span id="gameId"></span></div><div class="muted">Biar teman ikut, kirim link game yang sama. Pemain pertama jadi Putih.</div></aside></section></main>
<script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search), gameId=params.get('game');$('gameId').textContent=gameId||'tidak ada';
const files='abcdefgh', ranks='87654321', pieces={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
let socket, myColor=null, state=null, selected=null, legalTargets=[];
function say(s){$('error').textContent=s||''}
function connect(){socket=io({transports:['websocket','polling']});socket.on('connect',()=>$('connection').textContent='Terhubung realtime');socket.on('disconnect',()=>$('connection').textContent='Terputus — mencoba ulang');socket.on('connect_error',()=>$('connection').textContent='Koneksi bermasalah');socket.on('game:state',s=>{state=s;render()})}
function join(){if(!gameId){say('Link game tidak valid. Buat game lewat perintah .chess di WhatsApp.');return}if(!socket)connect();$('join').disabled=true;socket.emit('game:join',{gameId,name:$('name').value.trim()||'Pemain'},r=>{ $('join').disabled=false;if(!r?.ok){say(r?.error||'Gagal gabung');return}myColor=r.color;state=r.state;$('setup').classList.add('hidden');say('Kamu bermain sebagai '+(myColor==='w'?'Putih':'Hitam')+'.');render()})}
function squareName(row,col){return files[col]+ranks[row]}
function render(){if(!state)return;const board=Array.from({length:8},()=>Array(8).fill(null));const fen=state.fen.split(' ')[0].split('/');fen.forEach((line,r)=>{let c=0;for(const ch of line){if(/[1-8]/.test(ch))c+=Number(ch);else{board[r][c]={color:ch===ch.toUpperCase()?'w':'b',type:ch.toLowerCase()};c++}}});let coords=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)coords.push({r,c});if(myColor==='b')coords.reverse();$('board').innerHTML='';for(const {r,c} of coords){const sq=squareName(r,c),piece=board[r][c],b=document.createElement('button');b.className='sq '+((r+c)%2?'dark':'light');if(selected===sq)b.classList.add('selected');if(legalTargets.includes(sq))b.classList.add('target');if(state.lastMove&&(state.lastMove.from===sq||state.lastMove.to===sq))b.classList.add('last');b.setAttribute('aria-label',sq);b.innerHTML=(piece?pieces[piece.color][piece.type]:'')+((r===7||c===0)?`<span class="coord">${sq}</span>`:'');b.onclick=()=>clickSquare(sq,board);$('board').appendChild(b)}
const players=state.players||[];for(let i=0;i<2;i++){const el=$(i===0?'white':'black'),p=players[i];el.querySelector('strong').textContent=p?p.name:'Menunggu pemain';el.classList.toggle('active',state.turn===(i===0?'w':'b')&&!state.gameOver)}$('status').textContent=state.status+(state.gameOver?'':state.turn===myColor?' — giliranmu':' — giliran lawan');$('reset').disabled=!myColor;}
function clickSquare(sq,board){if(!myColor||!state||state.gameOver)return;if(state.turn!==myColor){say('Tunggu giliran lawan.');return}const r=Number(ranks.indexOf(sq[1])),c=files.indexOf(sq[0]),piece=board[r][c];if(selected&&legalTargets.includes(sq)){socket.emit('game:move',{gameId,from:selected,to:sq,promotion:'q'},res=>{if(!res?.ok)say(res?.error||'Langkah gagal');else say('')});selected=null;legalTargets=[];return}if(piece&&piece.color===myColor){selected=sq;legalTargets=(state.legalMoves||[]).filter(m=>m.from===sq).map(m=>m.to);say(legalTargets.length?'Pilih kotak tujuan.':'Bidak ini tidak punya langkah legal.');render();return}selected=null;legalTargets=[];render()}
function renderSelectionHint(sq){const buttons=[...$('board').children];buttons.forEach(b=>{if(b.getAttribute('aria-label')===sq)b.classList.add('selected')})}
$('join').onclick=join;$('name').addEventListener('keydown',e=>{if(e.key==='Enter')join()});$('reset').onclick=()=>{if(confirm('Mulai ulang papan untuk kedua pemain?'))socket.emit('game:reset',{gameId},r=>{if(!r?.ok)say(r?.error||'Gagal reset');else{selected=null;legalTargets=[];say('Papan diulang.')}})};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);say('Link game tersalin.')}catch{say(location.href)}};
if(!gameId)say('Game ID tidak ada. Kirim .chess ke bot untuk membuat game.');else connect();
</script></body></html>
